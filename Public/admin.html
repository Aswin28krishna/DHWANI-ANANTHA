<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | Dhwani–Anantha</title>
<style>body{font:15px system-ui,sans-serif;margin:0;background:#f5ead7;color:#342a30}header{background:#35112d;color:#fff;padding:14px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header h1{font-size:18px;margin:0;flex:1}
main{padding:20px 24px}input,select,button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid #cdbb98}button{background:#ee7d1b;border:0;font-weight:700;cursor:pointer}button.g{background:#fff;border:1px solid #cdbb98}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border-radius:12px;display:grid;gap:12px}.wrap{overflow-x:auto;background:#fff;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px 12px;border-bottom:1px solid #eee3cc;text-align:left;vertical-align:top}th{background:#174d45;color:#fff;font-size:13px}
.s-new{background:#fff2e0}.s-paid,.s-approved{background:#e6f4ea}.s-rejected{background:#fbe9ea;color:#777}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.stats span{background:#fff;padding:6px 12px;border-radius:20px;font-size:13px}#err{color:#a3202f}.tabs{display:flex;gap:6px}.tabs button{background:#ffffff22;color:#fff}.tabs button.on{background:#ee7d1b;color:#2b160b}.evform{background:#fff;border-radius:10px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}.evform label{font-size:12px;font-weight:700;display:grid;gap:4px}.evform .full{grid-column:1/-1}.past{opacity:.55}[hidden]{display:none!important}</style></head><body>
<div id="login"><h2 style="margin:0">Admin sign in</h2><input id="pw" type="password" placeholder="Admin password" autofocus><button id="go">Sign in</button><div id="err"></div></div>
<div id="app" hidden><header><h1>Dhwani–Anantha admin</h1><div class="tabs"><button id="tA" class="on">Applications</button><button id="tE">Events</button></div><input id="q" placeholder="Search name, phone, email…"><select id="f"><option value="">All statuses</option></select><button class="g" id="csv">Export CSV</button><button class="g" id="out">Sign out</button></header><main id="apps"><div class="stats" id="stats"></div><div class="wrap"><table><thead><tr><th>#</th><th>Applied</th><th>Applicant</th><th>Contact</th><th>Category</th><th>Introduced by</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main>
<main id="evs" hidden><form class="evform" id="evf"><input type="hidden" id="eid"><label>Date<input type="date" id="ed" required></label><label>Title<input id="et" required maxlength="120" placeholder="Monthly Singing Meet"></label><label>Time<input id="etm" placeholder="5:00 PM"></label><label>Place<input id="ep" placeholder="Venue, Thiruvananthapuram"></label><label class="full">Note<input id="en" maxlength="300" placeholder="Open to members and guests."></label><div class="full"><button id="esave">Add event</button> <button type="button" class="g" id="ecancel" hidden>Cancel edit</button> <span id="emsg"></span></div></form>
<div class="wrap"><table style="min-width:640px"><thead><tr><th>Date</th><th>Event</th><th>Time</th><th>Place</th><th>Note</th><th></th></tr></thead><tbody id="erows"></tbody></table></div></main></div>
<script>
const ST=['new','contacted','paid','approved','rejected'],$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pw=sessionStorage.getItem('pw')||'',data=[];
const api=(u,o={})=>fetch(u,{...o,headers:{'Content-Type':'application/json','x-admin-password':pw}});
$('#f').innerHTML+=ST.map(s=>`<option>${s}</option>`).join('');
async function load(){const r=await api('/api/admin/applications');if(!r.ok){sessionStorage.removeItem('pw');$('#login').hidden=false;$('#app').hidden=true;$('#err').textContent=(await r.json()).error||'Error';return}
 data=await r.json();$('#login').hidden=true;$('#app').hidden=false;draw()}
function draw(){const q=$('#q').value.toLowerCase(),f=$('#f').value,l=data.filter(a=>(!f||a.status===f)&&(!q||[a.name,a.phone,a.email].join(' ').toLowerCase().includes(q)));
 $('#stats').innerHTML=`<span><b>${data.length}</b> total</span>`+ST.map(s=>`<span>${s}: <b>${data.filter(a=>a.status===s).length}</b></span>`).join('');
 $('#rows').innerHTML=l.map(a=>`<tr class="s-${a.status}"><td>${a.id}</td><td>${esc(a.created_at.slice(0,16))}</td><td><b>${esc(a.name)}</b><br>${esc(a.age)}<br><small>${esc(a.address)}</small></td><td><a href="https://wa.me/${a.phone.replace(/\D/g,'')}" target="_blank" rel="noopener">${esc(a.phone)}</a><br><a href="mailto:${esc(a.email)}">${esc(a.email)}</a></td><td>${esc(a.category)}</td><td>${esc(a.referrer)}<br><small>${esc(a.referrer_details)}</small></td>
 <td><select data-id="${a.id}" class="st">${ST.map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></td><td><input data-id="${a.id}" class="nt" value="${esc(a.notes)}" placeholder="Add note"></td><td><button class="g del" data-id="${a.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="9">No applications yet.</td></tr>'}
document.addEventListener('change',async e=>{const t=e.target,id=t.dataset.id;if(!id)return;await api('/api/admin/applications/'+id,{method:'PATCH',body:JSON.stringify(t.classList.contains('st')?{status:t.value}:{notes:t.value})});if(t.classList.contains('st'))load()});
document.addEventListener('click',async e=>{if(e.target.classList.contains('del')&&confirm('Delete this application permanently?')){await api('/api/admin/applications/'+e.target.dataset.id,{method:'DELETE'});load()}});
$('#go').onclick=()=>{pw=$('#pw').value;sessionStorage.setItem('pw',pw);load()};$('#pw').onkeydown=e=>e.key==='Enter'&&$('#go').click();
$('#q').oninput=$('#f').onchange=draw;$('#out').onclick=()=>{sessionStorage.clear();location.reload()};
$('#csv').onclick=async()=>{const r=await api('/api/admin/export.csv');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='applications.csv';a.click()};
let evs=[];
function showTab(e){$('#apps').hidden=e;$('#evs').hidden=!e;$('#tA').classList.toggle('on',!e);$('#tE').classList.toggle('on',e);['#q','#f','#csv'].forEach(i=>$(i).hidden=e);if(e)loadEv()}
$('#tA').onclick=()=>showTab(false);$('#tE').onclick=()=>showTab(true);
async function loadEv(){const r=await api('/api/admin/events');if(!r.ok)return;evs=await r.json();const t=new Date().toISOString().slice(0,10);
 $('#erows').innerHTML=evs.map(e=>`<tr class="${e.date<t?'past':''}"><td><b>${esc(e.date)}</b></td><td>${esc(e.title)}</td><td>${esc(e.time)}</td><td>${esc(e.place)}</td><td>${esc(e.note)}</td><td><button class="g ed" data-id="${e.id}">Edit</button> <button class="g dl" data-id="${e.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No events yet. Add the first one above.</td></tr>'}
function resetEv(){$('#evf').reset();$('#eid').value='';$('#esave').textContent='Add event';$('#ecancel').hidden=true}
$('#ecancel').onclick=resetEv;
$('#evf').onsubmit=async e=>{e.preventDefault();const id=$('#eid').value,body={date:$('#ed').value,title:$('#et').value,time:$('#etm').value,place:$('#ep').value,note:$('#en').value};
 const r=await api(id?'/api/admin/events/'+id:'/api/admin/events',{method:id?'PUT':'POST',body:JSON.stringify(body)});
 $('#emsg').textContent=r.ok?'Saved ✓ — live on the website now.':(await r.json()).error;if(r.ok){resetEv();loadEv()}};
document.addEventListener('click',async e=>{const b=e.target,id=b.dataset&&b.dataset.id;
 if(b.classList.contains('ed')){const v=evs.find(x=>x.id==id);$('#eid').value=id;$('#ed').value=v.date;$('#et').value=v.title;$('#etm').value=v.time;$('#ep').value=v.place;$('#en').value=v.note;$('#esave').textContent='Save changes';$('#ecancel').hidden=false;scrollTo({top:0,behavior:'smooth'})}
 if(b.classList.contains('dl')&&confirm('Delete this event?')){await api('/api/admin/events/'+id,{method:'DELETE'});loadEv()}});
if(pw)load();
</script></body></html>
